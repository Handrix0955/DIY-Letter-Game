<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none, viewport-fit=cover">
    <title>Handrix's DIY Puzzle Box</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        body {
            min-height: 100vh;
            justify-content: center;
            padding: 32px 20px 48px;
            box-sizing: border-box;
        }

        .hall {
            width: 100%;
            max-width: 420px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .hall-brand {
            text-align: center;
            margin-bottom: 8px;
        }

        .hall-kicker {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-note);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .hall-brand h1 {
            font-size: 26px;
            letter-spacing: 0.5px;
            margin: 0 0 8px;
            color: var(--text-main);
        }

        .hall-brand p {
            margin: 0;
            font-size: 14px;
            color: var(--text-note);
            font-weight: 600;
        }

        .game-card {
            display: block;
            text-decoration: none;
            color: inherit;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 22px 20px;
            box-shadow: 0 12px 32px var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .game-card:active { transform: scale(0.98); }

        .game-card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .game-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            flex-shrink: 0;
        }

        .game-icon .icon { width: 22px; height: 22px; }

        .game-card h2 {
            margin: 0 0 6px;
            font-size: 18px;
        }

        .game-card p {
            margin: 0;
            font-size: 13px;
            line-height: 1.55;
            color: var(--text-note);
            font-weight: 600;
        }

        .game-meta {
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
        }

        .status-live { color: #059669; }
        .status-soon { color: #d97706; }

        [data-theme="dark"] .status-live { color: #34d399; }
        [data-theme="dark"] .status-soon { color: #fbbf24; }

        .enter-hint {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-main);
        }

        .hall-theme {
            align-self: center;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            margin-top: 6px;
        }

        .card-sudoku .game-icon { color: #2563eb; }
        .card-star .game-icon { color: #a855f7; }

        .hall-bottom { display: flex; gap: 10px; align-self: center; }
        .hall-bottom .hall-theme { margin-top: 0; }
    </style>
<link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/app-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body data-skin="default" data-theme="dark">
    <canvas id="canvas-fx"></canvas>
    <canvas id="canvas-confetti"></canvas>

    <div class="hall">
        <div class="hall-brand">
            <div class="hall-kicker">
                <svg class="icon" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
                DIY PUZZLE BOX
            </div>
            <h1>Handrix's DIY Puzzle Box</h1>
            <p data-i18n="hall_sub">可自定义的开源解谜小站</p>
        </div>
        <div style="display:flex; justify-content:center;">
            <div class="lang-toggle" onclick="toggleGlobalLang()">
                <div class="lang-btn active" id="lang-cn">中</div>
                <div class="lang-btn" id="lang-en">EN</div>
            </div>
        </div>

        <a class="game-card card-sudoku" href="games/diy-sudoku/diy.html">
            <div class="game-card-top">
                <div>
                    <h2 data-i18n="card_diy_title">DIY 自定义数独</h2>
                    <p data-i18n="card_diy_desc">输入 9 个互不相同的字符，生成你的专属盘面。每一次无冲突的逻辑推理，都是一次完美的挑战。</p>
                </div>
                <div class="game-icon">
                    <svg class="icon" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/><path d="M3 15h18"/><path d="M15 21V9"/></svg>
                </div>
            </div>
            <div class="game-meta">
                <span class="status-live" data-i18n="status_live">可游玩</span>
                <span class="enter-hint"><span data-i18n="enter">进入</span>
                    <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </span>
            </div>
        </a>

        <a class="game-card card-star" href="games/starbattle/star.html">
            <div class="game-card-top">
                <div>
                    <h2 data-i18n="card_star_title">星战捕捉大作战</h2>
                    <p data-i18n="card_star_desc">在交错的网格中找出隐藏的目标，排除掉所有的错误选项，剩下的那一个，就是正确的答案。</p>
                </div>
                <div class="game-icon">
                    <svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 15 8.5 22 9.3 17 14.2 18.2 21 12 17.8 5.8 21 7 14.2 2 9.3 9 8.5 12 2"/></svg>
                </div>
            </div>
            <div class="game-meta">
                <span class="status-live" data-i18n="status_live">可游玩</span>
                <span class="enter-hint"><span data-i18n="enter">进入</span>
                    <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </span>
            </div>
        </a>

        <div class="hall-tip">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 16v-4"/><path d="M12 8h.01"/><circle cx="12" cy="12" r="10"/></svg>
            <span data-i18n="hall_offline_tip">用浏览器打开后选择“添加到主屏幕”，即可安装为离线应用，断网也能玩大厅与双游戏。</span>
        </div>

        <div class="hall-bottom">
            <button type="button" class="hall-theme glass-panel" onclick="openSkinModal()">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 22a10 10 0 1 1 10-10c0 1.5-1 2.5-2.5 2.5h-1.87a1.5 1.5 0 0 0-1.42 2.05l.38 1.15c.21.63-.3 1.3-.98 1.3H12Z"/><circle cx="7.5" cy="10.5" r="1.5"/><circle cx="10.5" cy="7.5" r="1.5"/><circle cx="14.5" cy="8.5" r="1.5"/><circle cx="17.5" cy="11.5" r="1.5"/></svg>
                <span data-i18n="hall_theme">主题</span>
            </button>
            <button type="button" class="hall-theme glass-panel" id="theme-btn" onclick="toggleTheme()">
                <svg class="icon" id="theme-icon" viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.7.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
                <span id="theme-text">开灯</span>
            </button>
        </div>
        <div class="hall-version" id="hall-version">v1.0</div>
    </div>

    <!-- 主题弹窗 -->
    <div class="modal-overlay" id="skinModal">
        <div class="modal-content" style="text-align: center;">
            <h2 style="color: #a855f7;"><svg class="icon" viewBox="0 0 24 24"><path d="M12 22a10 10 0 1 1 10-10c0 1.5-1 2.5-2.5 2.5h-1.87a1.5 1.5 0 0 0-1.42 2.05l.38 1.15c.21.63-.3 1.3-.98 1.3H12Z"/><circle cx="7.5" cy="10.5" r="1.5"/><circle cx="10.5" cy="7.5" r="1.5"/><circle cx="14.5" cy="8.5" r="1.5"/><circle cx="17.5" cy="11.5" r="1.5"/></svg> 主题色彩</h2>
            <hr style="border: 0; border-top: 1px solid var(--glass-border); margin-bottom: 20px;">
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <button class="skin-opt" onclick="changeSkin('default')" style="background: linear-gradient(135deg, #e0c3fc, #8ec5fc); color: #1e293b;">
                    <svg class="icon" viewBox="0 0 24 24"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg> 星空青 (Cyan)
                </button>
                <button class="skin-opt" onclick="changeSkin('purple')" style="background: linear-gradient(135deg, #e2c0ff, #c49aeb); color: #3b0764;">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg> 罗兰紫 (Purple)
                </button>
                <button class="skin-opt" onclick="changeSkin('emerald')" style="background: linear-gradient(135deg, #a7f3d0, #34d399); color: #064e3b;">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/></svg> 翡冷翠雾绿 (Emerald)
                </button>
            </div>
            <button class="close-btn" onclick="closeModal('skinModal')">选好了！</button>
        </div>
    </div>

    <script src="js/common.js"></script>
<script>
    window.HALL_DICT = {
        cn: {
            hall_sub: "可自定义的开源解谜小站",
            card_diy_title: "DIY 自定义数独",
            card_diy_desc: "输入 9 个互不相同的字符，生成你的专属盘面。每一次无冲突的逻辑推理，都是一次完美的挑战。",
            card_star_title: "星战捕捉大作战",
            card_star_desc: "在交错的网格中找出隐藏的目标，排除掉所有的错误选项，剩下的那一个，就是正确的答案。",
            status_live: "可游玩",
            enter: "进入",
            hall_theme: "主题",
            hall_offline_tip: "用浏览器打开后选择“添加到主屏幕”，即可安装为离线应用，断网也能玩大厅与双游戏。"
        },
        en: {
            hall_sub: "A customizable open-source puzzle lobby",
            card_diy_title: "DIY Custom Sudoku",
            card_diy_desc: "Enter 9 unique characters to generate your own board. Every clean logical deduction is a perfect challenge.",
            card_star_title: "Starbattle Hunt",
            card_star_desc: "Find the hidden target in the grid, rule out every wrong option, and the one that remains is the answer.",
            status_live: "Playable",
            enter: "Enter",
            hall_theme: "Theme",
            hall_offline_tip: "Open in a browser, then choose Add to Home Screen to install the offline app. The lobby and both games work offline."
        }
    };
    window.onGlobalLangApplied = function() {
        applyThemeUI();
    };
    document.addEventListener('DOMContentLoaded', () => { applyGlobalLang(); });
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            navigator.serviceWorker.register("sw.js").catch(function (err) {
                console.warn("SW register failed:", err);
            });
        });
    }
    </script>
</body>
</html>
